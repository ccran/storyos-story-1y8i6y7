          var rawEdge = edges.find(function (item) { return item.source === node.id && item.sourceHandle === option.id; });
          if (!edge && rawEdge && rawEdge.hideWhenLocked) return;
          var button = element('button');
          button.type = 'button';
          button.disabled = !edge;
          button.appendChild(element('b', '', option.silent ? '…' : String.fromCharCode(65 + index)));
          button.appendChild(element('span', '', option.silent ? (option.label || '保持沉默') : option.label));
          button.appendChild(element('i', '', '›'));
          button.addEventListener('click', function () {
            var selectedEdge = nextFrom(node.id, option.id);
            if (selectedEdge) { applyEffects(selectedEdge); show(selectedEdge.target, false, selectedEdge); }

          });
          choices.appendChild(button);
        });
        panel.appendChild(choices);
        panel.appendChild(element('p', '', '你的选择会进入对应的故事分支'));

        playButton.type = 'button';
        playButton.setAttribute('aria-label', '播放');
        playButton.addEventListener('click', function () { setPlaying(!playing); });
        controls.appendChild(playButton);
        controls.appendChild(element('span', 'time-label', formatTime(progressSeconds) + ' / ' + (node.duration || formatTime(durationToSeconds(node.duration))))).id = 'time-label';
        var progress = element('button', 'progress');
        progress.type = 'button';
        progress.setAttribute('aria-label', '调整播放进度');
        progress.appendChild(element('span'));
        progress.addEventListener('click', function (event) {
          var rect = progress.getBoundingClientRect();
          progressSeconds = Math.max(0, Math.min(durationToSeconds(node.duration), ((event.clientX - rect.left) / rect.width) * durationToSeconds(node.duration)));
          renderMediaFrame(node);
          persist();
        });
        controls.appendChild(progress);
        if (node.skippable) {
          var skip = element('button', 'control-button', '≫');
          skip.type = 'button';
          skip.setAttribute('aria-label', '快进到下一段剧情');
          skip.title = '快进到下一段剧情';
          skip.addEventListener('click', function () { advance(node); });
          controls.appendChild(skip);
        }
        var fullscreen = element('button', 'control-button', '⛶');
        fullscreen.type = 'button';
        fullscreen.setAttribute('aria-label', '全屏');
        fullscreen.addEventListener('click', toggleFullscreen);
        controls.appendChild(fullscreen);
        stage.appendChild(controls);
        stage.onpointermove = function (event) {
          var bounds = stage.getBoundingClientRect();
          var revealHeight = Math.min(150, bounds.height * 0.28);
          controls.classList.toggle('is-visible', event.clientY >= bounds.bottom - revealHeight);
        };
        stage.onpointerleave = function () { controls.classList.remove('is-visible'); };
        renderMediaFrame(node);
      }

      function renderMediaFrame(node) {
        var duration = durationToSeconds(node.duration);
        var asset = assetForNodeAt(node, progressSeconds);
        var visual = assetVisual(asset);
        var backdrop = document.getElementById('stage-media');
        if (visual) {
          var needsVideo = asset && asset.type === 'video' && asset.source;
          var expectedTag = needsVideo ? 'VIDEO' : 'IMG';
          if (!backdrop || backdrop.tagName !== expectedTag) {
            var replacement = element(needsVideo ? 'video' : 'img', 'stage-media');
            if (backdrop) backdrop.replaceWith(replacement);
            else stage.insertBefore(replacement, stage.firstChild);
            backdrop = replacement;
            backdrop.id = 'stage-media';
            if (needsVideo) {
              backdrop.playsInline = true;
              backdrop.preload = 'auto';
            } else backdrop.alt = '';
          }
          if (backdrop.getAttribute('src') !== visual) backdrop.src = visual;
          if (needsVideo) {
            backdrop.volume = Math.max(0, Math.min(1, (node.volume == null ? 70 : node.volume) / 100));
            var visualClip = (node.timeline || []).find(function (clip) {
              return (clip.type === 'video' || clip.type === 'image') && !clipIsMuted(node, clip) && progressSeconds >= clip.start && progressSeconds <= clip.start + clip.duration;
            });
            var mediaSecond = Math.max(0, progressSeconds - ((visualClip && visualClip.start) || 0));
            if (Math.abs((backdrop.currentTime || 0) - mediaSecond) > (playing ? .35 : .04)) {
              try { backdrop.currentTime = mediaSecond; } catch (error) { /* 元数据加载前暂不跳转。 */ }
            }
            if (playing) backdrop.play().catch(function () { /* 等待用户再次点击播放。 */ });
            else backdrop.pause();
          }
          backdrop.style.display = '';
        } else if (backdrop) {
          if (backdrop.tagName === 'VIDEO') backdrop.pause();
          backdrop.style.display = 'none';
        }

        var activeAudioClips = (node.timeline || []).filter(function (clip) {
          return clip.type === 'audio' && !clipIsMuted(node, clip) && progressSeconds >= clip.start && progressSeconds < clip.start + clip.duration;
        });
        var stageAudioElements = Array.prototype.slice.call(stage.querySelectorAll('audio[data-stage-audio="true"]'));
        var activeAudioIds = {};
        var containsAiSpeech = false;
        activeAudioClips.forEach(function (audioClip) {
          var audioAsset = assets.find(function (item) { return item.id === audioClip.assetId; });
          if (!audioAsset || !audioAsset.source) return;
          activeAudioIds[audioClip.id] = true;
          if (audioClip.audioRole === 'voice' && audioAsset.aiGenerated && audioAsset.aiGenerated.provider) containsAiSpeech = true;
          var audio = stageAudioElements.find(function (item) { return item.dataset.clipId === audioClip.id; });
          if (!audio) {
            audio = element('audio');
            audio.dataset.stageAudio = 'true';
            audio.dataset.clipId = audioClip.id;
            audio.preload = 'auto';
            stage.appendChild(audio);
            stageAudioElements.push(audio);
          }
          if (audio.getAttribute('src') !== audioAsset.source) audio.src = audioAsset.source;
          audio.loop = Boolean(audioClip.loop);
          var audioSecond = Math.max(0, progressSeconds - audioClip.start);
          var audioDuration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : audioClip.duration;
          var audioTarget = audioClip.loop && audioDuration > 0 ? audioSecond % audioDuration : Math.min(audioSecond, Math.max(0, audioDuration - .01));
          if (Math.abs((audio.currentTime || 0) - audioTarget) > (playing ? .35 : .04)) {
            try { audio.currentTime = audioTarget; } catch (error) { /* 元数据加载前暂不跳转。 */ }
          }
          var audioBaseVolume = Math.max(0, Math.min(1, (audioClip.volume == null ? 70 : audioClip.volume) / 100));
          var audioRemaining = Math.max(0, audioClip.start + audioClip.duration - progressSeconds);
          var fadeInScale = audioClip.fadeIn ? Math.min(1, audioSecond / audioClip.fadeIn) : 1;
          var fadeOutScale = audioClip.fadeOut ? Math.min(1, audioRemaining / audioClip.fadeOut) : 1;
          audio.volume = audioBaseVolume * Math.min(fadeInScale, fadeOutScale);
          if (playing) audio.play().catch(function () { /* 等待用户再次点击播放。 */ });
          else audio.pause();
        });
        stageAudioElements.forEach(function (audio) {
          if (activeAudioIds[audio.dataset.clipId]) return;
          audio.pause();
          audio.remove();
        });
        var disclosure = document.getElementById('ai-speech-disclosure');
        if (containsAiSpeech && !disclosure) {
          disclosure = element('div', 'ai-disclosure', '此语音由人工智能生成');
          disclosure.id = 'ai-speech-disclosure';
          stage.appendChild(disclosure);
        } else if (!containsAiSpeech && disclosure) disclosure.remove();

        var textClip = (node.timeline || []).find(function (clip) {
          return clip.type === 'text' && !clipIsMuted(node, clip) && clip.content && clip.content.trim() && progressSeconds >= clip.start && progressSeconds <= clip.start + clip.duration;
        });
        var copy = document.getElementById('story-copy');
        copy.innerHTML = '';
        if (textClip) {
          copy.style.display = '';
          copy.style.color = textClip.textColor || '#f7f8fb';
          copy.style.borderLeftColor = textClip.textColor || '#f7f8fb';
          if (textClip.speaker && textClip.speaker.trim()) {
            var speaker = element('span', 'speaker', textClip.speaker);
            speaker.style.fontSize = (textClip.speakerFontSize || 12) + 'px';
            copy.appendChild(speaker);
          }
          var paragraph = element('p', '', textClip.content);
          paragraph.style.fontSize = (textClip.contentFontSize || 20) + 'px';
          copy.appendChild(paragraph);
        } else {
          copy.style.display = 'none';
        }

        var ratio = Math.min(100, (progressSeconds / duration) * 100);
        var progressFill = stage.querySelector('.progress span');
        if (progressFill) progressFill.style.width = ratio + '%';
        var timeLabel = document.getElementById('time-label');
        if (timeLabel) timeLabel.textContent = formatTime(progressSeconds) + ' / ' + formatTime(duration);
      }

      function setPlaying(next) {
        playing = Boolean(next);
        if (timer) window.clearInterval(timer);
        timer = null;
        var button = document.getElementById('play-button');
        if (button) {
          button.textContent = playing ? 'Ⅱ' : '▶';
          button.setAttribute('aria-label', playing ? '暂停' : '播放');
        }
        var media = document.getElementById('stage-media');
        if (media && media.tagName === 'VIDEO') {
          if (playing) media.play().catch(function () { /* 等待用户再次点击播放。 */ });
          else media.pause();
        }
        stage.querySelectorAll('audio[data-stage-audio="true"]').forEach(function (audio) {
          if (playing) audio.play().catch(function () { /* 等待用户再次点击播放。 */ });
          else audio.pause();
        });
        if (!playing) return;
        timer = window.setInterval(function () {
          var node = nodes.find(function (item) { return item.id === currentId; });
          if (!node || node.type !== 'media') { setPlaying(false); return; }
          progressSeconds += 0.2;
          if (progressSeconds >= durationToSeconds(node.duration)) {
            progressSeconds = durationToSeconds(node.duration);
            renderMediaFrame(node);
            persist();
            setPlaying(false);
            window.setTimeout(function () { advance(node); }, 220);
            return;
          }
          renderMediaFrame(node);
          if (Math.round(progressSeconds * 10) % 10 === 0) persist();
        }, 200);
      }

      function advance(node) {
        var edge = nextFrom(node.id);
        if (edge) { applyEffects(edge); show(edge.target, false, edge); }
        else if (storyStack.length) { returnFromStory(); }
        else { setPlaying(false); persist(); }
      }

      function returnFromStory() {
        var frame = storyStack.pop();
        if (!frame) { setPlaying(false); persist(); return; }
        var edge = nextFrom(frame.flowId);
        if (edge) { applyEffects(edge); show(edge.target, false, edge); }
        else { setPlaying(false); persist(); }
      }

      function toggleFullscreen() {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (gameView.requestFullscreen) gameView.requestFullscreen();
      }

      function openTree(from) {
        returnView = from;
        setView('tree');
        renderTree();
      }

      function renderTree() {
        treeStage.innerHTML = '';
        treeCanvas = null;
        treeSelectedId = '';
        var unlockedCount = playableNodes.filter(function (node) { return unlocked.indexOf(node.id) !== -1; }).length;
        document.getElementById('tree-summary').textContent = '已解锁 ' + unlockedCount + ' / ' + playableNodes.length + ' 段命运 · 拖动画布或滚轮缩放；再次点击本轮节点，可连同变量状态一起回溯';
        if (!nodes.length) {
          treeStage.appendChild(element('div', 'empty-tree', '还没有可展示的剧情'));
          return;
        }

        var cardWidth = 224;
        var normalHeight = 138;
        var terminalHeight = 76;
        var columnGap = 104;
        var rowGap = 46;
        var nodeIds = new Set(nodes.map(function (node) { return node.id; }));
        var incoming = {};
        var outgoing = {};
        var depths = {};
        nodes.forEach(function (node) { incoming[node.id] = 0; depths[node.id] = 0; });
        var runEdgeSet = new Set(historyEdgeIds);
        edges.forEach(function (edge) {
          if (!nodeIds.has(edge.source) || !nodeIds.has(edge.target)) return;
          incoming[edge.target] += 1;
          if (!outgoing[edge.source]) outgoing[edge.source] = [];
          outgoing[edge.source].push(edge.target);
        });

        var queue = nodes
          .filter(function (node) { return incoming[node.id] === 0; })
          .sort(function (a, b) { return Number(b.type === 'start') - Number(a.type === 'start'); })
          .map(function (node) { return node.id; });
        var visited = new Set();
        while (queue.length) {
          var sourceId = queue.shift();
          visited.add(sourceId);
          (outgoing[sourceId] || []).forEach(function (targetId) {
            depths[targetId] = Math.max(depths[targetId], depths[sourceId] + 1);
            incoming[targetId] -= 1;
            if (incoming[targetId] === 0) queue.push(targetId);
          });
        }
        var deepest = Math.max.apply(null, Object.keys(depths).map(function (id) { return depths[id]; }).concat([0]));
        nodes.filter(function (node) { return !visited.has(node.id); }).forEach(function (node) { depths[node.id] = deepest + 1; });

        var columns = {};
        nodes.forEach(function (node) {
          var column = depths[node.id];
          if (!columns[column]) columns[column] = [];
          columns[column].push(node);
        });
        Object.keys(columns).forEach(function (column) {
          columns[column].sort(function (a, b) { return a.y - b.y || String(a.title).localeCompare(String(b.title)); });
        });

        var columnNumbers = Object.keys(columns).map(Number).sort(function (a, b) { return a - b; });
        var maxColumnHeight = Math.max.apply(null, columnNumbers.map(function (column) {
          return columns[column].reduce(function (total, node) {
            return total + (node.type === 'start' || node.type === 'end' ? terminalHeight : normalHeight);
          }, 0) + Math.max(0, columns[column].length - 1) * rowGap;
        }).concat([normalHeight]));
        var canvasWidth = Math.max(treeGrid.clientWidth - 2, 96 + (Math.max.apply(null, columnNumbers) + 1) * cardWidth + Math.max.apply(null, columnNumbers) * columnGap);
        var canvasHeight = Math.max(treeGrid.clientHeight - 2, maxColumnHeight + 96);
        var canvas = element('div', 'tree-canvas');
        canvas.style.width = canvasWidth + 'px';
        canvas.style.height = canvasHeight + 'px';
        canvas.dataset.width = String(canvasWidth);
        canvas.dataset.height = String(canvasHeight);
        var positions = {};

        columnNumbers.forEach(function (column) {
          var columnHeight = columns[column].reduce(function (total, node) {
            return total + (node.type === 'start' || node.type === 'end' ? terminalHeight : normalHeight);
          }, 0) + Math.max(0, columns[column].length - 1) * rowGap;
          var y = (canvasHeight - columnHeight) / 2;
          columns[column].forEach(function (node) {
            var height = node.type === 'start' || node.type === 'end' ? terminalHeight : normalHeight;
            positions[node.id] = { x: 48 + column * (cardWidth + columnGap), y: y, height: height };
            y += height + rowGap;
          });
        });

        var svgNamespace = 'http://www.w3.org/2000/svg';
        var lines = document.createElementNS(svgNamespace, 'svg');
        lines.setAttribute('class', 'tree-lines');
        lines.setAttribute('width', String(canvasWidth));
        lines.setAttribute('height', String(canvasHeight));
        var definitions = document.createElementNS(svgNamespace, 'defs');
        var marker = document.createElementNS(svgNamespace, 'marker');
        marker.setAttribute('id', 'tree-arrow');
        marker.setAttribute('viewBox', '0 0 10 8');
        marker.setAttribute('refX', '9');
        marker.setAttribute('refY', '4');
        marker.setAttribute('markerWidth', '8');
        marker.setAttribute('markerHeight', '8');
        marker.setAttribute('orient', 'auto');
        var arrow = document.createElementNS(svgNamespace, 'path');
        arrow.setAttribute('d', 'M 0 0 L 10 4 L 0 8 z');
        arrow.setAttribute('fill', '#7182a6');
        marker.appendChild(arrow);
        definitions.appendChild(marker);
        lines.appendChild(definitions);
        edges.forEach(function (edge) {
          var source = positions[edge.source];
          var target = positions[edge.target];
          if (!source || !target) return;
          var sourceX = source.x + cardWidth;
          var sourceY = source.y + source.height / 2;
          var targetX = target.x;
          var targetY = target.y + target.height / 2;
          var bendX = (sourceX + targetX) / 2;
          var path = document.createElementNS(svgNamespace, 'path');
          path.setAttribute('d', 'M ' + sourceX + ' ' + sourceY + ' C ' + bendX + ' ' + sourceY + ', ' + bendX + ' ' + targetY + ', ' + targetX + ' ' + targetY);
          path.setAttribute('marker-end', 'url(#tree-arrow)');
          if (unlockedEdges.indexOf(edge.id) !== -1) path.classList.add('is-known');
          if (runEdgeSet.has(edge.id)) path.classList.add('in-run');
          lines.appendChild(path);
        });
        canvas.appendChild(lines);

        nodes.forEach(function (node, index) {
          var isUnlocked = node.type === 'start' || unlocked.indexOf(node.id) !== -1;
          var inRun = history.indexOf(node.id) !== -1;
          var isCurrent = node.id === currentId;
          var canRewind = node.type === 'start' || inRun;
          var terminalClass = node.type === 'start' ? ' start-node' : node.type === 'end' ? ' end-node' : '';
          var stateClasses = (inRun ? ' in-run' : '') + (isCurrent ? ' is-current' : '');
          var card = element('button', 'plot-card ' + (isUnlocked ? 'unlocked' : 'locked') + terminalClass + stateClasses);
          card.type = 'button';
          card.style.left = positions[node.id].x + 'px';
          card.style.top = positions[node.id].y + 'px';
          if (!isUnlocked) {
            var question = element('div', 'question');
            question.appendChild(element('b', '', '?'));
            question.appendChild(element('span', '', '尚未解锁'));
            card.appendChild(question);
          } else {
            var cover = coverForNode(node);
            if (cover && node.type !== 'start' && node.type !== 'end') {
              var image = element('img', 'plot-cover');
              image.src = cover;
              image.alt = '';
              card.appendChild(image);
            }
            card.appendChild(element('div', 'plot-shade'));
            card.appendChild(element('span', 'plot-index', String(index + 1).padStart(2, '0')));
            var copy = element('div', 'plot-copy');
            copy.appendChild(element('small', '', node.type === 'start' ? '故事起点' : node.type === 'choice' ? '关键抉择' : node.type === 'end' ? '故事结局' : '影视节点'));
            copy.appendChild(element('strong', '', node.title || '未命名剧情'));
            card.appendChild(copy);
            if (canRewind) {
              var rewindMark = element('span', 'rewind-mark', '↶');
              rewindMark.setAttribute('aria-hidden', 'true');
              card.appendChild(rewindMark);
            }
          }
          card.setAttribute('aria-label', !isUnlocked
            ? '未知命运'
            : canRewind
              ? '聚焦「' + (node.title || '未命名剧情') + '」，再次点击回溯剧情与变量'
              : '聚焦已解锁命运「' + (node.title || '未命名剧情') + '」');
          card.addEventListener('click', function () {
            focusTreeNode(node, card, positions[node.id], canRewind);
          });
          canvas.appendChild(card);
        });
        treeStage.appendChild(canvas);
        treeCanvas = canvas;
        window.requestAnimationFrame(fitTree);
      }

      treeGrid.addEventListener('pointerdown', function (event) {
        if (event.button !== 0 || event.target.closest('.tree-controls')) return;
        treePointer = {
          id: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: treeX,
          originY: treeY
        };
        treePanMoved = false;
        treeGrid.classList.add('is-panning');
      });
      treeGrid.addEventListener('pointermove', function (event) {
        if (!treePointer || treePointer.id !== event.pointerId) return;
        var deltaX = event.clientX - treePointer.startX;
        var deltaY = event.clientY - treePointer.startY;
        if (Math.abs(deltaX) + Math.abs(deltaY) > 4 && !treePanMoved) {
          treePanMoved = true;
          treeGrid.setPointerCapture(event.pointerId);
        }
        treeX = treePointer.originX + deltaX;
        treeY = treePointer.originY + deltaY;
        applyTreeTransform();
      });
      function finishTreePan(event) {
        if (!treePointer || treePointer.id !== event.pointerId) return;
        treePointer = null;
        treeGrid.classList.remove('is-panning');
        window.setTimeout(function () { treePanMoved = false; }, 0);
      }
      treeGrid.addEventListener('pointerup', finishTreePan);
      treeGrid.addEventListener('pointercancel', finishTreePan);
      treeGrid.addEventListener('wheel', function (event) {
        if (!treeCanvas) return;
        event.preventDefault();
        var bounds = treeGrid.getBoundingClientRect();
        var factor = event.deltaY < 0 ? 1.12 : 0.89;
        setTreeScale(treeScale * factor, event.clientX - bounds.left, event.clientY - bounds.top);
      }, { passive: false });
      document.getElementById('tree-zoom-out').addEventListener('click', function () {
        setTreeScale(treeScale / 1.2, treeGrid.clientWidth / 2, treeGrid.clientHeight / 2);
      });
      document.getElementById('tree-zoom-in').addEventListener('click', function () {
        setTreeScale(treeScale * 1.2, treeGrid.clientWidth / 2, treeGrid.clientHeight / 2);
      });
      document.getElementById('tree-fit').addEventListener('click', fitTree);

      document.getElementById('start-button').addEventListener('click', startNewGame);
      document.getElementById('continue-button').addEventListener('click', continueGame);
      document.getElementById('tree-button').addEventListener('click', function () { openTree('home'); });
      document.getElementById('game-tree-button').addEventListener('click', function () { persist(); openTree('game'); });
      document.getElementById('home-button').addEventListener('click', function () { persist(); setView('home'); });
      document.getElementById('tree-back-button').addEventListener('click', function () { setView(returnView); if (returnView === 'game' && currentId) show(currentId, true); });
      window.addEventListener('beforeunload', persist);
      window.addEventListener('resize', function () {
        if (treeView.classList.contains('active')) fitTree();
      });
      window.addEventListener('keydown', function (event) {
        if (event.code === 'Space' && gameView.classList.contains('active')) {
          var node = nodes.find(function (item) { return item.id === currentId; });
          if (node && node.type === 'media') { event.preventDefault(); setPlaying(!playing); }
        }
        if (treeView.classList.contains('active') && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(event.code) !== -1) {
          event.preventDefault();
          var panStep = event.shiftKey ? 160 : 64;
          if (event.code === 'ArrowLeft') treeX += panStep;
          if (event.code === 'ArrowRight') treeX -= panStep;
          if (event.code === 'ArrowUp') treeY += panStep;
          if (event.code === 'ArrowDown') treeY -= panStep;
          applyTreeTransform();
        }
        if (event.code === 'Escape' && treeView.classList.contains('active')) document.getElementById('tree-back-button').click();
      });

      updateHomeMenu();
    })();

  </script>
</body>
</html>
